<!DOCTYPE html>
<html lang="az" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İdarəetmə Panelinə Giriş | DoogagAuto</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #07090e;
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            background-image: 
                radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.10) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 70%);
        }
        .login-card {
            background: linear-gradient(145deg, rgba(23, 28, 41, 0.85) 0%, rgba(13, 16, 24, 0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md login-card rounded-3xl p-8 sm:p-10 relative overflow-hidden">
        <!-- Top decorative glows -->
        <div class="absolute -top-16 -left-16 w-36 h-36 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -right-16 w-36 h-36 bg-blue-500/15 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header / Logo -->
        <div class="text-center mb-8 relative">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 mx-auto flex items-center justify-center text-white shadow-xl shadow-emerald-950/40 mb-4 border border-emerald-400/20">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wide text-white">DOOGAG<span class="text-emerald-400">AUTO</span></h1>
            <p class="text-xs text-slate-400 font-semibold tracking-wider uppercase mt-1">İdarəetmə Panelinə Təhlükəsiz Giriş</p>
            <p class="text-[11px] text-slate-500 mt-1 max-w-xs mx-auto">
                Bu sistem yalnız səlahiyyətli adminlər üçündür. Giriş üçün şifrə daxil edilməlidir.
            </p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-3 animate-shake">
            <div class="w-7 h-7 rounded-lg bg-rose-500/20 flex items-center justify-center text-rose-400 flex-shrink-0">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <span class="leading-relaxed">{{ error }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form action="/admin/login" method="POST" class="space-y-5">
            <!-- Username Input -->
            <div class="space-y-1.5">
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                    İstifadəçi Adı
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm pointer-events-none">
                        <i class="fa-solid fa-user-shield"></i>
                    </span>
                    <input type="text" id="username" name="username" required autofocus placeholder="admin"
                           class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 text-white placeholder-slate-600 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-150">
                </div>
            </div>

            <!-- Password Input -->
            <div class="space-y-1.5">
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                    Giriş Şifrəsi
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm pointer-events-none">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full pl-10 pr-11 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 text-white placeholder-slate-600 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-150 font-mono">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none">
                        <i class="fa-solid fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    class="w-full py-3.5 px-4 rounded-xl font-bold text-sm bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-lg shadow-emerald-950/50 transition duration-150 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                <i class="fa-solid fa-key"></i>
                Panelə Daxil Ol
            </button>
        </form>

        <!-- Footer Notice -->
        <div class="mt-8 text-center text-[11px] text-slate-500 border-t border-slate-800/80 pt-4 flex items-center justify-center gap-2">
            <i class="fa-solid fa-shield text-emerald-500/60"></i>
            <span>DoogagAuto Pan-European Arbitrage Platform &copy; 2026</span>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
